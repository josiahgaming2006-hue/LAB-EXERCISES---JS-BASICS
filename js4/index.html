<!DOCTYPE html>
<html>
<head>
  <title>Button Click Events</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .container {
      width: 300px;
      margin: 100px auto;
      padding: 20px;
      background-color: white;
      border-radius: 5px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Change Content</h2>

  <button onclick="showMessage1()">Message 1</button>
  <button onclick="showMessage2()">Message 2</button>

  <p id="content">Click a button to change this text.</p>
</div>

<!-- Link to JavaScript -->
<script src="main.js"></script>

</body>
</html>
